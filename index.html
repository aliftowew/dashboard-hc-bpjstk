<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Pengawasan Dewas 2026–2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#f2f6fa;--surface:#fff;--surface-2:#eaf1f7;--sidebar:#fff;
  --ink:#0e2233;--ink-2:#3d5568;--muted:#566d80;--line:#dde7f0;--line-strong:#c3d4e2;
  --accent:#0b77bd;--accent-soft:#e3f0fa;--accent-ink:#0a6ba9;--on-accent:#fff;
  --ok:#257534;--ok-soft:#ddf3e1;--warn:#a8490a;--warn-soft:#fdf0d3;--crit:#b91c1c;--crit-soft:#fde3e0;
  --bayang:0 1px 3px rgb(14 34 51 / .07);--bayang-naik:0 8px 24px rgb(14 34 51 / .10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#071520;--surface:#0f2231;--surface-2:#16303f;--sidebar:#0b1c29;
  --ink:#e6f0f8;--ink-2:#b3c8d8;--muted:#7e9bb0;--line:#1e394b;--line-strong:#2b5169;
  --accent:#4aa8e0;--accent-soft:#0e2d40;--accent-ink:#4aa8e0;--on-accent:#05131d;
  --ok:#6ede8a;--ok-soft:#0d3320;--warn:#f0c069;--warn-soft:#3a2d12;--crit:#f2938c;--crit-soft:#3e1d1b;
  --bayang:0 1px 3px rgb(0 0 0 / .4);--bayang-naik:0 8px 24px rgb(0 0 0 / .5);
}}
:root[data-theme="dark"]{
  --ground:#071520;--surface:#0f2231;--surface-2:#16303f;--sidebar:#0b1c29;
  --ink:#e6f0f8;--ink-2:#b3c8d8;--muted:#7e9bb0;--line:#1e394b;--line-strong:#2b5169;
  --accent:#4aa8e0;--accent-soft:#0e2d40;--accent-ink:#4aa8e0;--on-accent:#05131d;
  --ok:#6ede8a;--ok-soft:#0d3320;--warn:#f0c069;--warn-soft:#3a2d12;--crit:#f2938c;--crit-soft:#3e1d1b;
  --bayang:0 1px 3px rgb(0 0 0 / .4);--bayang-naik:0 8px 24px rgb(0 0 0 / .5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.ikon{width:1em;height:1em;display:inline-block;vertical-align:middle;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Kerangka: di ponsel menu jadi strip tab lengket; di layar lebar jadi sidebar 16rem. */
.app{min-height:100dvh}
.bar{display:flex;align-items:center;gap:.6rem;background:var(--surface);border-bottom:1px solid var(--line);padding:.6rem 1rem}
.merek{display:flex;align-items:center;gap:.6rem;min-width:0}
.marka{display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:.75rem;background:var(--accent);color:var(--on-accent);font-size:1.15rem;flex:none}
.merek b{display:block;font-size:.95rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tombol-ikon{margin-left:auto;display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:.75rem;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:1.15rem;flex:none}
.tombol-ikon:hover{background:var(--surface-2)}
.sisi{position:sticky;top:0;z-index:20}
.menu{display:flex;gap:.25rem;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);padding:.4rem .75rem;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu a{display:flex;align-items:center;gap:.45rem;white-space:nowrap;border-radius:.75rem;padding:.5rem .75rem;font-weight:500;color:var(--ink-2);text-decoration:none}
.menu a .ikon{font-size:1.1rem;color:var(--muted)}
.menu a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.menu a[aria-current="page"] .ikon{color:var(--accent-ink)}
.menu .hitung{margin-left:.15rem}
.label-grup{display:none}
main{padding:1.25rem 1rem 3rem;min-width:0;max-width:72rem}
main:focus{outline:none}
.sisi-merek{display:none}
@media (min-width:1024px){
  .app{display:grid;grid-template-columns:17.5rem minmax(0,1fr)}
  .sisi{position:sticky;top:0;height:100dvh;background:var(--sidebar);border-right:1px solid var(--line);padding:.9rem .75rem;display:flex;flex-direction:column;gap:1rem}
  .sisi-merek{display:flex}
  .bar .merek{display:none}
  .bar{background:transparent;border:0;padding:1rem 2.5rem 0}
  .menu{position:static;flex-direction:column;border:0;padding:0;background:transparent;overflow:visible}
  .menu a{padding:.5rem .75rem;gap:.75rem;white-space:normal;line-height:1.25}
  .menu .hitung{margin-left:auto}
  .label-grup{display:block;font-size:.6rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);padding:.5rem .75rem .15rem}
  main{padding:.5rem 2.5rem 4rem}
}

.kicker{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
h1{font-size:1.75rem;line-height:1.1;font-weight:800;letter-spacing:-.025em;margin-top:.35rem}
.ket{margin-top:.4rem;max-width:64ch;color:var(--ink-2)}
h2.bagian{font-size:1.1rem;font-weight:800;letter-spacing:-.02em;margin:1.75rem 0 .75rem}
.kartu{background:var(--surface);border:1px solid var(--line);border-radius:1rem;box-shadow:var(--bayang)}
.panel{overflow:hidden;margin-top:1rem}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:.75rem;border-bottom:1px solid var(--line);padding:.8rem 1.1rem}
.panel>header h2,.panel>header h3{font-size:.95rem;font-weight:700;letter-spacing:-.01em}
.panel .isi{padding:1rem 1.1rem}
.gulir{overflow-x:auto}
.sumber{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.62rem;letter-spacing:.04em;color:var(--muted);white-space:nowrap}

.grid{display:grid;gap:.75rem;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:1rem}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.stat .nilai{font-size:1.5rem}}
.stat{padding:.9rem;display:flex;flex-direction:column;gap:.3rem;min-width:0}
.stat .nilai{font-size:1.3rem;line-height:1.05;font-weight:800;letter-spacing:-.03em;overflow-wrap:anywhere}
.stat .label{font-size:.82rem;font-weight:600;color:var(--ink-2)}
.stat .cat{font-size:.74rem;color:var(--muted)}
.stat .sumber{margin-top:auto;padding-top:.3rem}
.n-ok{color:var(--ok)}.n-warn{color:var(--warn)}.n-crit{color:var(--crit)}

.lencana{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.2rem .6rem;font-size:.72rem;font-weight:600;white-space:nowrap}
.lencana .ikon{font-size:.95rem}
.l-ok{background:var(--ok-soft);color:var(--ok)}.l-warn{background:var(--warn-soft);color:var(--warn)}
.l-crit{background:var(--crit-soft);color:var(--crit)}.l-aksen{background:var(--accent-soft);color:var(--accent-ink)}
.l-netral{background:var(--surface-2);color:var(--muted)}
.hitung{display:grid;place-items:center;height:1.25rem;min-width:1.25rem;padding:0 .35rem;border-radius:999px;background:var(--crit-soft);color:var(--crit);font-size:.68rem;font-weight:700}

/* Pemindah tampilan di tiap deputi */
.segmen{display:flex;gap:.25rem;border:1px solid var(--line);background:var(--surface-2);border-radius:1rem;padding:.25rem;margin-top:1rem;overflow-x:auto;scrollbar-width:none}
.segmen::-webkit-scrollbar{display:none}
.segmen button{flex:1 0 auto;border:0;background:transparent;border-radius:.75rem;padding:.5rem .8rem;font-size:.85rem;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:.35rem}
.segmen button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--bayang)}

/* Batang kemajuan: isi pekat = realisasi, garis tegak = prognosa/target */
.batang{display:grid;grid-template-columns:1fr auto;gap:.15rem .75rem;align-items:center;padding:.5rem 0}
.batang+.batang{border-top:1px solid var(--line)}
.batang .nm{font-size:.85rem;color:var(--ink-2);font-weight:500}
.batang .nl{font-size:.85rem;font-weight:700;text-align:right}
.batang .rel{grid-column:1/-1;position:relative;height:.55rem;border-radius:999px;background:var(--surface-2)}
.batang .rel i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--accent);min-width:2px}
.batang .rel i.ok{background:var(--ok)}.batang .rel i.warn{background:var(--warn)}.batang .rel i.crit{background:var(--crit)}.batang .rel i.netral{background:var(--line-strong)}
.batang .rel em{position:absolute;top:-.25rem;bottom:-.25rem;width:2px;background:var(--ink);border-radius:1px}
.batang .sub{grid-column:1/-1;font-size:.74rem;color:var(--muted)}
.legenda{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:.74rem;color:var(--muted);margin-bottom:.4rem}
.legenda span{display:inline-flex;align-items:center;gap:.35rem}
.legenda i{display:inline-block;width:.9rem;height:.5rem;border-radius:999px;background:var(--accent)}
.legenda i.tg{width:2px;height:.9rem;background:var(--ink);border-radius:1px}

/* Grafik kolom bulanan */
.kolom{display:grid;grid-template-columns:repeat(12,minmax(2.6rem,1fr));gap:.3rem;align-items:end;height:13rem;min-width:36rem;padding-top:1.4rem}
.kolom div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.2rem}
.kolom b{font-size:.68rem;font-weight:700}
.kolom i{display:block;width:70%;border-radius:.35rem .35rem 0 0;background:var(--accent);min-height:2px}
.kolom i.puncak{background:var(--ink)}
.kolom span{font-size:.68rem;color:var(--muted)}
.kolom small{font-size:.62rem;color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:.85rem}
th{border-bottom:1px solid var(--line);padding:.6rem 1.1rem;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;white-space:nowrap}
td{border-top:1px solid var(--line);padding:.6rem 1.1rem;vertical-align:middle;color:var(--ink-2)}
td.k,th.k{text-align:right}
td b{color:var(--ink)}
tr.total td{font-weight:700;color:var(--ink);background:var(--surface-2)}

/* Catatan bertepi = titik kritis */
.isu{display:flex;gap:.75rem;border-left-width:4px;border-radius:.5rem 1rem 1rem .5rem;padding:.9rem 1rem;margin-top:.75rem}
.isu.kritis{border-left-color:var(--crit)}.isu.klarifikasi{border-left-color:var(--warn)}.isu.pantau{border-left-color:var(--accent)}
.isu h3{font-size:.95rem;font-weight:700;letter-spacing:-.01em;margin:.4rem 0 .25rem}
.isu p{color:var(--ink-2);font-size:.86rem}
.isu .tanya{margin-top:.55rem;padding:.55rem .7rem;border-radius:.75rem;background:var(--surface-2);color:var(--ink);font-size:.86rem}
.isu .tanya .eyebrow{display:block;margin-bottom:.15rem}
.isu .atas{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .6rem}
.isu .badan{min-width:0;flex:1}

.kartu-deputi{display:block;padding:1rem;text-decoration:none;color:inherit}
.kartu-deputi:hover{border-color:var(--line-strong)}
.kartu-deputi .kepala{display:flex;align-items:center;gap:.6rem}
.kotak-ikon{display:grid;place-items:center;width:2.25rem;height:2.25rem;border-radius:.75rem;background:var(--accent-soft);color:var(--accent-ink);font-size:1.2rem;flex:none}
.kartu-deputi b.nm{font-size:1rem;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.2}
.kartu-deputi ul{list-style:none;margin:.75rem 0 0;padding:0;display:grid;gap:.4rem}
.kartu-deputi li{display:flex;gap:.5rem;font-size:.86rem;color:var(--ink-2)}
.kartu-deputi li b{color:var(--ink)}
.titik{flex:none;width:.5rem;height:.5rem;border-radius:999px;margin-top:.45rem;background:var(--line-strong)}
.titik.ok{background:var(--ok)}.titik.warn{background:var(--warn)}.titik.crit{background:var(--crit)}
.dua{display:grid;gap:.75rem;margin-top:1rem}
@media (min-width:760px){.dua{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dua>.panel{margin-top:0}

.cari{position:relative;display:flex;align-items:center;margin-top:1rem}
.cari .ikon{position:absolute;left:.8rem;font-size:1.1rem;color:var(--muted);pointer-events:none}
.cari input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:.75rem;padding:.65rem .8rem .65rem 2.4rem;font:inherit;box-shadow:var(--bayang)}
.cari input:focus-visible{border-color:var(--accent)}
.chips{display:flex;gap:.4rem;overflow-x:auto;margin-top:.6rem;padding-bottom:.2rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap;border-radius:999px;padding:.4rem .85rem;font-size:.82rem;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.paket{display:flex;gap:.75rem;align-items:flex-start;padding:.75rem 1.1rem;border-top:1px solid var(--line)}
.paket:first-child{border-top:0}
.paket .jd{font-weight:600;color:var(--ink);font-size:.88rem}
.paket .kd{font-size:.68rem;color:var(--muted)}
.paket .lencana{margin-left:auto;flex:none}
.kosong{padding:2.5rem 1rem;text-align:center;color:var(--ink-2)}
ul.daftar{margin:0;padding:0;list-style:none;display:grid;gap:.5rem}
ul.daftar li{display:flex;gap:.55rem;color:var(--ink-2);font-size:.88rem}
ul.daftar li b{color:var(--ink)}
.kaki{margin-top:2rem;font-size:.74rem;color:var(--muted);max-width:76ch}
@media (prefers-reduced-motion:no-preference){.batang .rel i,.kolom i{transition:width .3s,height .3s}}

.panel>header h2{font-size:.95rem;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.4rem;margin-top:0}
main{padding-top:1rem}
/* Laci sidebar di layar sempit; sidebar tetap di layar lebar */
.tirai{display:none;position:fixed;inset:0;z-index:30;border:0;background:rgb(14 34 51 / .4)}
.tirai.buka{display:block}
.bar{gap:.5rem}
.judul-bar{font-size:.95rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tombol-ikon{margin-left:0}
.pilih-bulan{margin-left:auto;display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--muted)}
.pilih-bulan select{font:inherit;font-size:.85rem;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:.75rem;height:2.5rem;padding:0 .6rem}
.menu .kd{margin-left:auto;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.62rem;letter-spacing:.08em;color:var(--muted)}
@media (max-width:1023px){
  .sisi{position:fixed;inset:0 auto 0 0;z-index:40;width:17rem;max-width:85vw;background:var(--sidebar);border-right:1px solid var(--line);padding:.9rem .75rem;display:flex;flex-direction:column;gap:1rem;transform:translateX(-100%);visibility:hidden;box-shadow:var(--bayang-naik)}
  .sisi.buka{transform:none;visibility:visible}
  .sisi-merek{display:flex}
  .menu{position:static;flex-direction:column;border:0;padding:0;background:transparent;overflow:visible}
  .menu a{white-space:normal;gap:.75rem;padding:.65rem .75rem}
  .label-grup{display:block;font-size:.6rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);padding:.5rem .75rem .15rem}
  .bar{position:sticky;top:0;z-index:20}
}
@media (prefers-reduced-motion:no-preference){@media (max-width:1023px){.sisi{transition:transform .2s,visibility .2s}}}
@media (min-width:1024px){.buka-menu,.tutup,.judul-bar{display:none}.bar{padding:1rem 2.5rem 0}}
/* Ubin cincin */
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:900px){.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ubin{display:flex;align-items:center;gap:.7rem;padding:.8rem;min-width:0}
.ubin>div{min-width:0;display:flex;flex-direction:column}
.ubin .label{font-size:.74rem;font-weight:600;color:var(--muted)}
.ubin b{font-size:1rem;font-weight:800;letter-spacing:-.02em;line-height:1.25;overflow-wrap:anywhere}
.ubin b.besar{font-size:1.6rem;line-height:1.1}
.ubin .cat{font-size:.72rem;color:var(--muted)}
.ring{width:3.4rem;height:3.4rem;flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .rl{stroke:var(--surface-2)}
.ring .rf{stroke:var(--accent);stroke-linecap:round}
.ring .rf.ok{stroke:var(--ok)}.ring .rf.warn{stroke:var(--warn)}.ring .rf.crit{stroke:var(--crit)}
.ring text{font-size:15px;font-weight:800;fill:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:420px){.ubin{flex-direction:column;align-items:flex-start;gap:.45rem}}
.dep{display:flex;flex-direction:column;gap:.6rem;padding:.8rem;text-decoration:none;color:inherit;min-width:0}
.dep:hover{border-color:var(--line-strong)}
.dep .kepala{display:flex;align-items:center;gap:.5rem;min-width:0}
.dep .kotak-ikon{width:1.9rem;height:1.9rem;font-size:1rem}
.dep b.nm{display:block;font-size:.85rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.dep .duo{display:flex;gap:.6rem}
.dep .duo>span{display:flex;flex-direction:column;align-items:center;gap:.15rem}
.dep .duo .ring{width:3rem;height:3rem}
.dep small{font-size:.66rem;color:var(--muted);font-weight:600}
.dep .pg{font-size:.78rem;font-weight:700;color:var(--ink-2)}
/* Batang satu baris */
.b1{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem .75rem;align-items:baseline;padding:.5rem 0}
.b1+.b1{border-top:1px solid var(--line)}
.b1 .nm{font-size:.84rem;font-weight:500;color:var(--ink-2)}
.b1 .nl{font-size:.78rem;color:var(--muted);white-space:nowrap}
.b1 .nl b{font-size:.9rem;color:var(--ink)}
.b1 .rel{grid-column:1/-1;position:relative;height:.5rem;border-radius:999px;background:var(--surface-2)}
.b1 .rel i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--accent)}
.b1 .rel i.netral{background:var(--line-strong)}.b1 .rel i.ok{background:var(--ok)}
.b1 .rel em{position:absolute;top:-.25rem;bottom:-.25rem;width:2px;background:var(--ink);border-radius:1px}
.tag{font-style:normal;font-size:.62rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:.1rem .45rem;margin-right:.4rem;white-space:nowrap}
/* Kurva */
.kurva{width:100%;height:auto;display:block}
.kurva .gl{stroke:var(--line);stroke-width:1}
.kurva .ax{font-size:10px;fill:var(--muted)}.kurva .ax.on{fill:var(--ink);font-weight:700}
.kurva .ar{fill:var(--surface-2)}
.kurva .lr{fill:none;stroke:var(--line-strong);stroke-width:2.5}
.kurva .la{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.kurva .mk{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.kurva .dr{fill:var(--surface);stroke:var(--muted);stroke-width:2}.kurva .da{fill:var(--accent)}
.kurva .lb{font-size:11px;font-weight:700;fill:var(--ink)}
@media (max-width:600px){.kurva .ax{font-size:16px}.kurva .lb{font-size:18px}.kurva .lr{stroke-width:4}.kurva .la{stroke-width:5}}
.thn{margin-left:auto;display:inline-flex;gap:.2rem;border:1px solid var(--line);background:var(--surface-2);border-radius:.75rem;padding:.2rem}
.thn button{border:0;background:transparent;border-radius:.55rem;padding:.35rem .6rem;font-size:.82rem;font-weight:600;color:var(--ink-2)}
.thn button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.pilih-bulan{margin-left:0}
.per26{font-size:.74rem;color:var(--muted);white-space:nowrap}
@media (max-width:480px){.pilih-bulan>span{display:none}.judul-bar{display:none}}

   +panel('Kegiatan TW IV',sb('LND hal. 4–6'),`<table><thead><tr><th scope="col">Kegiatan</th><th scope="col">Bulan</th><th scope="col">Status</th></tr></thead><tbody>${LND_KEG.map(k=>`<tr><td>${k[0]}</td><td>${k[1]}</td><td><span class="lencana ${k[2]==='Selesai'?'l-ok':k[2]==='Berlangsung'?'l-aksen':'l-warn'}">${k[2]}</span></td></tr>`).join('')}</tbody></table>`,false)]}
};
function deputi26(r){const d=D[r],v=V26[r],tab=v.tab||[],s=Math.min(seg[r+'26']||0,v.v.length-1);
 return `<h1>${d.judul}</h1>${tab.length?`<div class="segmen" role="tablist" aria-label="Bagian ${d.kode}">${tab.map((n,i)=>`<button role="tab" aria-selected="${i===s}" data-seg="${i}">${n}</button>`).join('')}</div>`:''}<div role="tabpanel">${v.v[s]()}</div>${kaki26()}`}

/* ===== Navigasi ===== */
D.asp.anggaran[0].pendek='Belanja Modal';D.asp.anggaran[1].pendek='Tanah';D.asp.anggaran[2].pendek='BM SKP';
D.pdn.anggaran[0].total=D.pdn.pagu;
const MENU=[['ikhtisar','Ikhtisar','layout'],...Object.entries(D).map(([k,d])=>[k,d.nama,d.ikon,d.kode]),['tindak-lanjut','Tindak lanjut','list']];
const seg={};
const simpan=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},baca=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const rute=()=>{const h=location.hash.replace('#','');return MENU.some(x=>x[0]===h)?h:'ikhtisar'};
const sisi=document.getElementById('sisi'),buka=document.getElementById('buka');
function laci(b){sisi.classList.toggle('buka',b);document.getElementById('tirai').classList.toggle('buka',b);buka.setAttribute('aria-expanded',b);document.body.style.overflow=b?'hidden':'';if(b)document.getElementById('tutup').focus()}
function gambar(atas){const r=rute(),main=document.getElementById('konten');
 document.getElementById('menu').innerHTML=MENU.map((x,i)=>`${i===0?'<span class="label-grup">Ringkasan</span>':i===1?'<span class="label-grup">Deputi</span>':i===5?'<span class="label-grup">Rapat</span>':''}<a href="#${x[0]}" ${x[0]===r?'aria-current="page"':''}>${ik(x[2])}<span>${x[1]}</span>${x[3]?`<span class="kd">${x[3]}</span>`:''}</a>`).join('');
 document.querySelectorAll('[data-th]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===th));
 document.getElementById('per26').style.display=th==='2026'&&r!=='tindak-lanjut'?'':'none';
 document.getElementById('judul-bar').textContent=r==='ikhtisar'?'Pengawasan '+th:r==='tindak-lanjut'?'Tindak lanjut':D[r].kode;
 document.querySelector('.pilih-bulan').style.display=th==='2027'&&r!=='tindak-lanjut'?'':'none';
 if(r==='ikhtisar')main.innerHTML=th==='2026'?ikhtisar26():ikhtisar();
 else if(r==='tindak-lanjut')main.innerHTML=vTindak();
 else if(th==='2026')main.innerHTML=deputi26(r);
 else{const d=D[r],tab=[...(d.anggaran.length?['Anggaran']:[]),'Program kerja',...(r==='pdn'?['Pengadaan']:[])];
  const s=Math.min(seg[r]||0,tab.length-1),nm=tab[s];
  main.innerHTML=`<h1>${d.judul}</h1>
  ${tab.length>1?`<div class="segmen" role="tablist" aria-label="Bagian ${d.kode}">${tab.map((n,i)=>`<button role="tab" aria-selected="${i===s}" data-seg="${i}">${n}</button>`).join('')}</div>`:''}
  <div role="tabpanel">${nm==='Anggaran'?vAnggaran(r):nm==='Program kerja'?vProker(r):vPengadaan()}</div>${kaki()}`}
 document.title=(r==='ikhtisar'?'Ikhtisar':r==='tindak-lanjut'?'Tindak lanjut':D[r].kode)+' · Pengawasan Dewas '+th;
 if(atas)window.scrollTo(0,0)}
document.addEventListener('click',e=>{
 const y=e.target.closest('[data-th]');if(y){th=y.dataset.th;simpan('tahun',th);gambar(false);return}
 const b=e.target.closest('[data-seg]');if(b){seg[rute()+(th==='2026'?'26':'')]=+b.dataset.seg;gambar(false);return}
 if(e.target.closest('#buka'))laci(true);else if(e.target.closest('#tutup,#tirai,#menu a')){const t=sisi.classList.contains('buka');laci(false);if(t&&!e.target.closest('#menu a'))buka.focus()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sisi.classList.contains('buka')){laci(false);buka.focus()}});
window.addEventListener('hashchange',()=>gambar(true));
const sel=document.getElementById('bulan');sel.innerHTML=BLN_P.map((b,i)=>`<option value="${i}">${b}</option>`).join('');
if(baca('tahun')==='2027')th='2027';
const b0=+baca('bulan');if(b0>=0&&b0<12)m=b0;sel.value=m;
sel.addEventListener('change',()=>{m=+sel.value;simpan('bulan',m);gambar(false)});
const akar=document.documentElement,tbl=document.getElementById('tema');
const gelap=()=>akar.dataset.theme?akar.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
const ikonTema=()=>tbl.innerHTML=ik(gelap()?'sun':'moon');
const t0=baca('tema');if(t0==='dark'||t0==='light')akar.dataset.theme=t0;
tbl.addEventListener('click',()=>{const n=gelap()?'light':'dark';akar.dataset.theme=n;simpan('tema',n);ikonTema()});
document.getElementById('marka-sisi').innerHTML=ik('layout');buka.innerHTML=ik('menu');document.getElementById('tutup').innerHTML=ik('x');
ikonTema();gambar(false);
</script>
